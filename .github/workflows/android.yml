name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get app source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --project-name dyslexia_reading_tutor /tmp/dyslexia_reading_tutor
          cp -R /tmp/dyslexia_reading_tutor/android ./android

      - name: Add microphone permission for speech recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          permissions = '''\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'''
          content = content.replace('<application', permissions + '\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n    <application', 1)
          manifest.write_text(content)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: dyslexia-reading-tutor-android
          path: build/app/outputs/flutter-apk/app-debug.apk
